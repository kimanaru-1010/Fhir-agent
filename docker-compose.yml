# Healthcare Context Graph — Docker Compose
#
# Usage:
#   docker compose up --build -d

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: fhir-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fhir_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fhir_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile.backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    environment:
      NEO4J_URI: bolt://host.docker.internal:7687
      NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-password}
      INTERNAL_LLM_BASE_URL: ${INTERNAL_LLM_BASE_URL}
      INTERNAL_LLM_API_KEY: ${INTERNAL_LLM_API_KEY}
      INTERNAL_LLM_MODEL: ${INTERNAL_LLM_MODEL}
      INTERNAL_EMBEDDING_BASE_URL: ${INTERNAL_EMBEDDING_BASE_URL}
      INTERNAL_EMBEDDING_API_KEY: ${INTERNAL_EMBEDDING_API_KEY}
      INTERNAL_EMBEDDING_MODEL: ${INTERNAL_EMBEDDING_MODEL}
      INTERNAL_EMBEDDING_DIMS: ${INTERNAL_EMBEDDING_DIMS:-768}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-fhir_agent}
      MEM0_AGENT_ID: ${MEM0_AGENT_ID:-fhir-clinical-agent}
      MEM0_VECTOR_STORE_PROVIDER: pgvector
      MEM0_COLLECTION_NAME: ${MEM0_COLLECTION_NAME:-fhir_agent_memories}
      CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-3000},http://127.0.0.1:${FRONTEND_PORT:-3000}
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/fhir_agent
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-60}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    depends_on:
      - backend

volumes:
  postgres_data:
  frontend_node_modules:
  frontend_next:
