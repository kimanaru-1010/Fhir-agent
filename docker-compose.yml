# Healthcare Context Graph — Docker Compose
#
# Usage:
#   docker compose up --build -d

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: fhir-postgres
    environment:
      POSTGRES_DB: fhir_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile.backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    environment:
      NEO4J_URI: bolt://host.docker.internal:7687
      NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-password}
      INTERNAL_LLM_BASE_URL: ${INTERNAL_LLM_BASE_URL}
      INTERNAL_LLM_API_KEY: ${INTERNAL_LLM_API_KEY}
      INTERNAL_LLM_MODEL: ${INTERNAL_LLM_MODEL}
      INTERNAL_EMBEDDING_BASE_URL: ${INTERNAL_EMBEDDING_BASE_URL}
      INTERNAL_EMBEDDING_API_KEY: ${INTERNAL_EMBEDDING_API_KEY}
      INTERNAL_EMBEDDING_MODEL: ${INTERNAL_EMBEDDING_MODEL}
      INTERNAL_EMBEDDING_DIMS: ${INTERNAL_EMBEDDING_DIMS:-768}
      CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-3000}
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    depends_on:
      - backend

volumes:
  postgres_data:
  frontend_node_modules:
  frontend_next:
