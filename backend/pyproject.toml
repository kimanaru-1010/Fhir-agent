[project]
name = "fhir-agent-backend"
version = "0.1.0"
description = "Healthcare Context Graph Backend"
requires-python = ">=3.10, <3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "neo4j>=5.20",
    "pydantic-ai>=0.1",
    "openai>=2.46.0",
    "mem0ai",
    "psycopg[binary,pool]>=3.2",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.16",
    "pyjwt>=2.10",
    "pwdlib[argon2]>=0.3",
    "python-multipart>=0.0.9",
    "qdrant-client>=1.10.0",
    "langgraph>=0.2.0",
    "Pillow>=10.0.0",
    "rich>=13.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "aiosqlite>=0.20",
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "httpx>=0.27",  # for fastapi.testclient.TestClient
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
]
